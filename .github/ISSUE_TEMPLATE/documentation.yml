name: Documentation
description: Report incorrect, missing, outdated, or unclear documentation
title: "[Docs]: "

body:
  - type: dropdown
    attributes:
      label: Documentation Issue
      description: What is wrong with the documentation?
      options:
        - Incorrect information
        - Missing information
        - Unclear information
        - Typo or spelling error
        - Outdated information
        - Other
    validations:
      required: true

  - type: input
    attributes:
      label: Documentation Location
      description: Where can the issue be found?
      placeholder: "README.md or CONTRIBUTING.md"
    validations:
      required: true

  - type: textarea
    attributes:
      label: What Is Wrong?
      description: Explain what is incorrect, missing, or unclear.
      placeholder: |
        The documentation currently says...
        but it should say...
    validations:
      required: true

  - type: textarea
    attributes:
      label: Suggested Change
      description: Explain how you think the documentation should be changed.
      placeholder: |
        I suggest changing it to...
    validations:
      required: false

  - type: textarea
    attributes:
      label: Additional Information
      description: Add anything else that may help.
      placeholder: Additional information or screenshots.
    validations:
      required: false
