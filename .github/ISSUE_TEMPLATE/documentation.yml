name: Documentation
description: Report incorrect, missing, or unclear documentation
title: “[Docs] “

body:

* type: dropdown
    id: type
    attributes:
    label: Documentation Issue
    description: What is wrong with the documentation?
    options:
    - Incorrect information
    - Missing information
    - Unclear information
    - Typo or spelling error
    - Outdated information
    - Other
    validations:
    required: true
* type: input
    id: location
    attributes:
    label: Documentation Location
    description: Where is the documentation issue?
    placeholder: “README.md, CONTRIBUTING.md, etc.”
    validations:
    required: true
* type: textarea
    id: problem
    attributes:
    label: What’s Wrong?
    description: Explain what is incorrect, missing, or unclear.
    placeholder: |
    The documentation currently says…
    but it should say…
    validations:
    required: true
* type: textarea
    id: suggestion
    attributes:
    label: Suggested Change
    description: If possible, explain how the documentation should be changed.
    placeholder: |
    I suggest changing it to…
    validations:
    required: false
* type: textarea
    id: additional
    attributes:
    label: Additional Information
    description: Add anything else that may help.
    placeholder: Anything else?
    validations:
    required: false
